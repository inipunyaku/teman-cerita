server {
    listen 80;
    listen [::]:80;
    server_name temancerita.devmode.biz.id;

    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/acme/.well-known/acme-challenge/;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name temancerita.devmode.biz.id;

    # Symlink: sertifikat sementara, diganti otomatis ke Let's Encrypt oleh deploy/issue-cert.sh
    ssl_certificate /etc/nginx/ssl/temancerita/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/temancerita/privkey.pem;

    client_max_body_size 2m;

    # Realtime (Server-Sent Events): tanpa buffer, koneksi panjang.
    location = /api/stream {
        proxy_pass http://127.0.0.1:3410;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3410;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
